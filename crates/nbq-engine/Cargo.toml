[package]
name = "nbq-engine"
description = "Headless application engine: per-tab sessions, query lifecycle, transactions, fetch policy"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
serde-saphyr = { version = "1.3", default-features = false, features = ["deserialize"] }
async-openai = { version = "0.43", default-features = false, features = ["responses", "native-tls"] }
nbq-sql.workspace = true
nbq-core.workspace = true
nbq-driver.workspace = true
nbq-results.workspace = true
tokio.workspace = true
parking_lot.workspace = true
tracing.workspace = true
arrow-schema.workspace = true

[dev-dependencies]
nbq-driver.workspace = true
nbq-testkit.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["full"] }
