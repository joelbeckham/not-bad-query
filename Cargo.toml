[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT"
publish = false

[workspace.dependencies]
gq-sql = { path = "crates/gq-sql" }
gq-driver = { path = "crates/gq-driver" }
gq-results = { path = "crates/gq-results" }
gq-engine = { path = "crates/gq-engine" }
gq-core = { path = "crates/gq-core" }
gq-testkit = { path = "crates/gq-testkit" }

anyhow = "1"
thiserror = "2"
tokio = { version = "1.54", features = ["rt-multi-thread", "macros", "sync", "time", "net"] }
futures = "0.3"
tokio-postgres = { version = "0.7.18", features = ["with-chrono-0_4", "with-uuid-1", "with-serde_json-1"] }
postgres-types = "0.2.14"
arrow-array = "60.1"
arrow-schema = "60.1"
arrow-ipc = { version = "60.1", features = ["lz4"] }
arrow-buffer = "60.1"
chrono = "0.4"
uuid = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
csv = "1.4"
parking_lot = "0.12"
tempfile = "3"
tracing = "0.1"

insta = "1.49"
proptest = "1.12"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
